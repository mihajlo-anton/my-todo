<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>To-Do</title>
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    color: #e8e8e8;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    text-align: left;
  }
  #app {
    max-width: 640px;
    margin: 0;
    padding: 16px 12px 40px;
    min-height: 100vh;
  }

  #tabsBar {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    gap: 6px;
    padding: 2px 2px 16px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #tabsBar::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 160px;
  }
  .tab.editing {
    max-width: none;
  }
  .tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab-add {
    background: #101010;
    color: #444;
    font-weight: 600;
    font-size: 17px;
    padding: 7px 16px;
  }
  .tab-add:hover { color: #999; }
  .tab-edit-input {
    background: transparent;
    border: none;
    outline: none;
    color: #f2f2f2;
    font-size: 14px;
    font-family: inherit;
    width: 64px;
  }
  .tab-mode-toggle {
    font-size: 11px;
    color: #666;
    padding: 3px 7px;
    border-radius: 8px;
    cursor: pointer;
    background: #000;
  }
  .tab-mode-toggle.active { color: #8fd18f; }
  .tab-move {
    font-size: 13px;
    color: #777;
    padding: 3px 5px;
    cursor: pointer;
    line-height: 1;
  }
  .tab-move:hover { color: #ccc; }
  .tab-move.disabled { color: #333; cursor: default; }
  .tab-del {
    color: #777;
    font-size: 15px;
    padding: 0 2px;
  }
  .tab-del:hover { color: #ccc; }

  /* category row */
  .category {
    position: relative;
    margin-bottom: 8px;
  }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 2px;
    cursor: pointer;
    user-select: none;
  }
  .cat-name {
    font-size: 17px;
    font-weight: 500;
    color: #f2f2f2;
    letter-spacing: 0.2px;
    text-align: left;
  }
  .cat-meta {
    font-size: 12px;
    color: #555;
  }
  .cat-header:hover .cat-name { color: #fff; }
  .cat-del, .cat-edit {
    color: #555;
    font-size: 12px;
    padding: 3px 6px;
    cursor: pointer;
  }
  .cat-del:hover, .cat-edit:hover { color: #999; }
  .cat-move {
    color: #555;
    font-size: 14px;
    padding: 3px 5px;
    cursor: pointer;
    line-height: 1;
  }
  .cat-move:hover { color: #999; }
  .cat-move.disabled {
    color: #262626;
    cursor: default;
  }

  /* dropdown (pushes content below it down, since it's in normal flow) */
  .dropdown {
    background: #0d0d0d;
    border-radius: 8px;
    padding: 0 8px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.18s ease, padding 0.18s ease;
  }
  .dropdown.open {
    padding: 2px 8px 3px;
    max-height: 2000px;
  }

  .cat-edit-input {
    font-size: 17px;
    font-weight: 500;
    color: #f2f2f2;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    letter-spacing: 0.2px;
    width: 100%;
    text-align: left;
  }

  .item-row {
    display: flex;
    align-items: center;
    padding: 2px 2px;
    gap: 8px;
  }
  .checkbox {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    border: 1.5px solid #666;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
  }
  .checkbox:hover { border-color: #999; }
  .checkbox.checked {
    background: #4a4a4a;
    border-color: #4a4a4a;
  }
  .checkbox.checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #eee;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .item-text {
    flex: 1 1 auto;
    font-size: 15px;
    color: #ddd;
    word-break: break-word;
    text-align: left;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    padding: 2px 2px;
    min-width: 0;
  }
  .item-text.done {
    color: #4a4a4a;
    text-decoration: line-through;
  }
  .item-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .item-addsub, .item-del {
    flex: 0 0 auto;
    color: #666;
    cursor: pointer;
    border-radius: 8px;
    line-height: 1;
    text-align: center;
  }
  .item-addsub:hover, .item-del:hover { color: #ccc; background: #1c1c1c; }
  .item-addsub {
    font-size: 18px;
    padding: 4px 7px;
  }
  .item-del {
    font-size: 20px;
    padding: 4px 8px;
    color: #888;
  }
  .item-del:hover { color: #ddd; }

  .subtasks {
    margin-left: 24px;
    padding-left: 6px;
  }
  .sub-item-row .item-text { color: #bbb; }

  .workout-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 4px 0 8px;
  }
  .workout-table {
    border-collapse: collapse;
  }
  .workout-table th, .workout-table td {
    border: 1px solid #1a1a1a;
    padding: 0;
  }
  .wt-exercise, .wt-sets, .wt-week-header, .wt-subhead, .wt-addweek {
    font-size: 11px;
    color: #666;
    font-weight: 500;
    padding: 4px 6px;
    white-space: nowrap;
    text-align: left;
  }
  .wt-subhead { color: #444; font-weight: 400; }
  .wt-addweek { cursor: pointer; text-align: center; color: #555; }
  .wt-addweek:hover { color: #999; }
  .wt-week-header span { cursor: pointer; }
  .wt-week-del { margin-left: 4px; color: #555; cursor: pointer; }
  .wt-week-del:hover { color: #ccc; }
  .wt-week-edit-input {
    width: 70px;
    background: transparent;
    border: none;
    outline: none;
    color: #f2f2f2;
    font-size: 11px;
    font-family: inherit;
  }
  .wt-input {
    width: 55px;
    background: transparent;
    border: none;
    outline: none;
    color: #ddd;
    font-size: 13px;
    font-family: inherit;
    padding: 5px 6px;
    text-align: left;
  }
  .wt-exercise-input { width: 110px; }
  .wt-sets-input { width: 40px; text-align: center; }
  .wt-cell-input { width: 50px; text-align: center; }
  .wt-row-del {
    color: #888;
    font-size: 16px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .wt-row-del:hover { color: #ddd; }

  /* add category */
  .add-cat {
    margin-top: 8px;
    padding: 5px 2px;
  }
  .add-cat input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #666;
    font-size: 17px;
    font-family: inherit;
    font-weight: 500;
    text-align: left;
  }
  .add-cat input::placeholder { color: #333; }

  .footer-link {
    color: #555;
    font-size: 12px;
    cursor: pointer;
    margin-right: 16px;
  }
  .footer-link:hover { color: #999; }
  #backupBar { margin-top: 22px; padding: 0 4px; }
  #backupStatus { font-size: 10px; color: #333; margin-top: 5px; }

  #restorePanel { margin-top: 8px; padding: 0 4px; }
  #restoreInput {
    width: 100%;
    min-height: 120px;
    background: #0d0d0d;
    color: #ddd;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
  }
  .restore-actions { margin-top: 6px; }

  #version {
    margin-top: 16px;
    padding: 3px 4px;
    font-size: 10px;
    color: #333;
    text-align: left;
  }
</style>
</head>
<body>
<div id="app">
  <div id="tabsBar"></div>
  <div id="categories"></div>
  <div class="add-cat">
    <input id="newCatInput" type="text" placeholder="+ add category" maxlength="60" enterkeyhint="done">
  </div>

  <div id="backupBar">
    <span id="backupLink" class="footer-link">email backup</span>
    <span id="restoreLink" class="footer-link">restore</span>
    <div id="backupStatus"></div>
  </div>
  <div id="restorePanel" style="display:none;">
    <textarea id="restoreInput" placeholder="Paste your emailed backup text here"></textarea>
    <div class="restore-actions">
      <span id="restoreLoad" class="footer-link">load backup</span>
      <span id="restoreCancel" class="footer-link">cancel</span>
    </div>
  </div>

  <div id="version">v22</div>
</div>

<script>
(function() {
  "use strict";

  var STORAGE_KEY = "todo-data-v1";
  var state = load();

  function load() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.lists && parsed.lists.length) {
          if (!parsed.lists.some(function(l) { return l.id === parsed.currentListId; })) {
            parsed.currentListId = parsed.lists[0].id;
          }
          return parsed;
        }
        if (parsed && parsed.categories) {
          var migratedId = uid();
          return { lists: [{ id: migratedId, name: "List 1", categories: parsed.categories }], currentListId: migratedId };
        }
      }
    } catch (e) {}
    var freshId = uid();
    return { lists: [{ id: freshId, name: "List 1", categories: [] }], currentListId: freshId };
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var WORKOUT_SEED_KEY = "todo-workout-seeded";

  function ensureWorkoutTab() {
    var seeded = false;
    try { seeded = window.localStorage.getItem(WORKOUT_SEED_KEY) === "1"; } catch (e) {}
    if (seeded) return;

    var hasWorkoutList = state.lists.some(function(l) { return l.mode === "workout"; });
    if (!hasWorkoutList) {
      var days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      var categories = days.map(function(day) {
        return { id: uid(), name: day, items: [] };
      });
      state.lists.push({ id: uid(), name: "Workouts", mode: "workout", weeks: [{ id: uid(), label: "Week 1" }], categories: categories });
      save();
    }

    try { window.localStorage.setItem(WORKOUT_SEED_KEY, "1"); } catch (e) {}
  }

  var WORKOUT_PLAN_V1_KEY = "todo-workout-plan-v1-seeded";

  function ensureWorkoutPlanV1() {
    var seeded = false;
    try { seeded = window.localStorage.getItem(WORKOUT_PLAN_V1_KEY) === "1"; } catch (e) {}
    if (seeded) return;

    var plan = {
      "Monday": {
        label: "Monday — Deadlift Focus",
        exercises: [
          { text: "Deadlift", sets: "5" },
          { text: "Lat Pulldown", sets: "3" },
          { text: "Hip Thrust or Back Extension (weighted)", sets: "3" },
          { text: "Hanging Leg Raise or Ab Wheel", sets: "3" }
        ]
      },
      "Tuesday": {
        label: "Tuesday — Upper A (Push)",
        exercises: [
          { text: "Dumbbell Bench Press", sets: "4" },
          { text: "Overhead Press", sets: "4" },
          { text: "Chest Fly (dumbbell or cable)", sets: "3" },
          { text: "Face Pull", sets: "3" }
        ]
      },
      "Thursday": {
        label: "Thursday — Upper B (Pull)",
        exercises: [
          { text: "Lat Pulldown", sets: "3" },
          { text: "Barbell Row", sets: "3" },
          { text: "Push Press or Incline Bench", sets: "3" },
          { text: "Curl or Weighted Core", sets: "3" }
        ]
      },
      "Friday": {
        label: "Friday — Legs/Athletic",
        exercises: [
          { text: "Bulgarian Split Squat (per side)", sets: "4" },
          { text: "Single-Leg RDL (per side)", sets: "3" },
          { text: "Side-Lying Hip Adduction (per side)", sets: "3" },
          { text: "Core (anti-rotation)", sets: "3" }
        ]
      }
    };

    state.lists.forEach(function(list) {
      if (list.mode !== "workout") return;
      list.categories.forEach(function(cat) {
        var plannedDay = plan[cat.name];
        if (!plannedDay) return;
        if (cat.items.length > 0) return;
        cat.name = plannedDay.label;
        cat.items = plannedDay.exercises.map(function(ex) {
          return { id: uid(), text: ex.text, done: false, subtasks: [], sets: ex.sets, cells: {} };
        });
      });
    });

    save();
    try { window.localStorage.setItem(WORKOUT_PLAN_V1_KEY, "1"); } catch (e) {}
  }

  function getCurrentList() {
    var found = null;
    state.lists.forEach(function(l) { if (l.id === state.currentListId) found = l; });
    return found || state.lists[0];
  }

  var openCategoryIds = {};
  var editingCategoryId = null;
  var editingListId = null;
  var editingWeekId = null;

  var categoriesEl = document.getElementById("categories");
  var newCatInput = document.getElementById("newCatInput");
  var tabsBarEl = document.getElementById("tabsBar");

  function render() {
    categoriesEl.innerHTML = "";
    getCurrentList().categories.forEach(function(cat) {
      categoriesEl.appendChild(renderCategory(cat));
    });
  }

  function renderTabs() {
    tabsBarEl.innerHTML = "";
    state.lists.forEach(function(list) {
      tabsBarEl.appendChild(renderTab(list));
    });

    var addTab = document.createElement("div");
    addTab.className = "tab tab-add";
    addTab.textContent = "+";
    addTab.addEventListener("click", function() {
      var newList = { id: uid(), name: "List " + (state.lists.length + 1), categories: [] };
      state.lists.push(newList);
      state.currentListId = newList.id;
      editingListId = newList.id;
      openCategoryIds = {};
      editingCategoryId = null;
      save();
      renderTabs();
      render();
    });
    tabsBarEl.appendChild(addTab);
  }

  function hueForList(list) {
    var hash = 0;
    for (var i = 0; i < list.id.length; i++) {
      hash = (hash * 31 + list.id.charCodeAt(i)) % 360;
    }
    return hash;
  }

  function renderTab(list) {
    var isActive = state.currentListId === list.id;
    var isEditing = editingListId === list.id;
    var hue = hueForList(list);

    var tab = document.createElement("div");
    tab.className = "tab" + (isActive ? " active" : "") + (isEditing ? " editing" : "");
    tab.style.background = isActive ? "hsl(" + hue + ", 38%, 20%)" : "hsl(" + hue + ", 22%, 12%)";
    tab.style.color = isActive ? "hsl(" + hue + ", 65%, 88%)" : "hsl(" + hue + ", 25%, 55%)";

    if (isEditing) {
      var input = document.createElement("input");
      input.className = "tab-edit-input";
      input.type = "text";
      input.maxLength = 40;
      input.value = list.name;
      input.setAttribute("enterkeyhint", "done");

      var commit = function() {
        var val = input.value.trim();
        if (val) list.name = val;
        editingListId = null;
        save();
        renderTabs();
      };
      input.addEventListener("keydown", function(e) {
        e.stopPropagation();
        if (e.isComposing) return;
        if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); commit(); }
        if (e.key === "Escape") { editingListId = null; renderTabs(); }
      });
      input.addEventListener("click", function(e) { e.stopPropagation(); });
      input.addEventListener("blur", commit);
      tab.appendChild(input);

      var listIdx = state.lists.indexOf(list);

      var moveLeft = document.createElement("div");
      moveLeft.className = "tab-move" + (listIdx === 0 ? " disabled" : "");
      moveLeft.textContent = "◀";
      moveLeft.addEventListener("mousedown", function(e) { e.preventDefault(); });
      moveLeft.addEventListener("click", function(e) {
        e.stopPropagation();
        if (listIdx === 0) return;
        var tmp = state.lists[listIdx - 1];
        state.lists[listIdx - 1] = state.lists[listIdx];
        state.lists[listIdx] = tmp;
        save();
        renderTabs();
      });
      tab.appendChild(moveLeft);

      var moveRight = document.createElement("div");
      moveRight.className = "tab-move" + (listIdx === state.lists.length - 1 ? " disabled" : "");
      moveRight.textContent = "▶";
      moveRight.addEventListener("mousedown", function(e) { e.preventDefault(); });
      moveRight.addEventListener("click", function(e) {
        e.stopPropagation();
        if (listIdx === state.lists.length - 1) return;
        var tmp = state.lists[listIdx + 1];
        state.lists[listIdx + 1] = state.lists[listIdx];
        state.lists[listIdx] = tmp;
        save();
        renderTabs();
      });
      tab.appendChild(moveRight);

      var modeToggle = document.createElement("div");
      modeToggle.className = "tab-mode-toggle" + (list.mode === "workout" ? " active" : "");
      modeToggle.textContent = "grid mode";
      modeToggle.addEventListener("mousedown", function(e) { e.preventDefault(); });
      modeToggle.addEventListener("click", function(e) {
        e.stopPropagation();
        if (list.mode === "workout") {
          list.mode = undefined;
        } else {
          list.mode = "workout";
          list.weeks = list.weeks || [{ id: uid(), label: "Week 1" }];
        }
        save();
        renderTabs();
        render();
      });
      tab.appendChild(modeToggle);

      var del = document.createElement("div");
      del.className = "tab-del";
      del.textContent = "×";
      del.addEventListener("mousedown", function(e) { e.preventDefault(); });
      del.addEventListener("click", function(e) {
        e.stopPropagation();
        if (state.lists.length <= 1) {
          alert("You need at least one list.");
          return;
        }
        if (confirm('Delete "' + list.name + '" and everything in it?')) {
          state.lists = state.lists.filter(function(l) { return l.id !== list.id; });
          if (state.currentListId === list.id) {
            state.currentListId = state.lists[0].id;
          }
          editingListId = null;
          openCategoryIds = {};
          editingCategoryId = null;
          save();
          renderTabs();
          render();
        }
      });
      tab.appendChild(del);

      setTimeout(function() { input.focus(); input.select(); }, 0);
    } else {
      var label = document.createElement("span");
      label.className = "tab-label";
      label.textContent = list.name;
      tab.appendChild(label);

      tab.addEventListener("click", function() {
        if (isActive) {
          editingListId = list.id;
          renderTabs();
          return;
        }
        state.currentListId = list.id;
        openCategoryIds = {};
        editingCategoryId = null;
        save();
        renderTabs();
        render();
      });
    }

    return tab;
  }

  function renderCategory(cat) {
    var wrap = document.createElement("div");
    wrap.className = "category";

    var header = document.createElement("div");
    header.className = "cat-header";

    var isEditing = editingCategoryId === cat.id;
    var name;

    if (isEditing) {
      name = document.createElement("input");
      name.className = "cat-edit-input";
      name.type = "text";
      name.maxLength = 60;
      name.value = cat.name;
      name.setAttribute("enterkeyhint", "done");

      var commit = function() {
        var val = name.value.trim();
        if (val) cat.name = val;
        editingCategoryId = null;
        save();
        render();
      };
      name.addEventListener("keydown", function(e) {
        e.stopPropagation();
        if (e.isComposing) return;
        if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); commit(); }
        if (e.key === "Escape") { editingCategoryId = null; render(); }
      });
      name.addEventListener("click", function(e) { e.stopPropagation(); });
      name.addEventListener("blur", commit);
    } else {
      name = document.createElement("div");
      name.className = "cat-name";
      name.textContent = cat.name;
    }

    var right = document.createElement("div");
    right.style.display = "flex";
    right.style.alignItems = "center";
    right.style.gap = "4px";

    var completed = cat.items.filter(function(i) { return i.done; }).length;
    var meta = document.createElement("div");
    meta.className = "cat-meta";
    meta.textContent = cat.items.length ? (completed + "/" + cat.items.length) : "";

    var catList = getCurrentList().categories;
    var catIdx = catList.indexOf(cat);

    var up = document.createElement("div");
    up.className = "cat-move" + (catIdx === 0 ? " disabled" : "");
    up.textContent = "▲";
    up.addEventListener("click", function(e) {
      e.stopPropagation();
      if (catIdx === 0) return;
      var tmp = catList[catIdx - 1];
      catList[catIdx - 1] = catList[catIdx];
      catList[catIdx] = tmp;
      save();
      render();
    });

    var down = document.createElement("div");
    down.className = "cat-move" + (catIdx === catList.length - 1 ? " disabled" : "");
    down.textContent = "▼";
    down.addEventListener("click", function(e) {
      e.stopPropagation();
      if (catIdx === catList.length - 1) return;
      var tmp = catList[catIdx + 1];
      catList[catIdx + 1] = catList[catIdx];
      catList[catIdx] = tmp;
      save();
      render();
    });

    var edit = document.createElement("div");
    edit.className = "cat-edit";
    edit.textContent = "edit";
    edit.addEventListener("click", function(e) {
      e.stopPropagation();
      editingCategoryId = cat.id;
      render();
    });

    var del = document.createElement("div");
    del.className = "cat-del";
    del.textContent = "remove";
    del.addEventListener("click", function(e) {
      e.stopPropagation();
      if (confirm('Delete category "' + cat.name + '" and all its items?')) {
        var curList = getCurrentList();
        curList.categories = curList.categories.filter(function(c) { return c.id !== cat.id; });
        delete openCategoryIds[cat.id];
        save();
        render();
      }
    });

    if (!isEditing) {
      right.appendChild(meta);
      right.appendChild(up);
      right.appendChild(down);
      right.appendChild(edit);
      right.appendChild(del);
    }
    header.appendChild(name);
    header.appendChild(right);

    header.addEventListener("click", function() {
      if (editingCategoryId === cat.id) return;
      var willOpen = !openCategoryIds[cat.id];
      openCategoryIds[cat.id] = willOpen;
      if (willOpen && cat.items.length === 0) {
        var newItem = { id: uid(), text: "", done: false, subtasks: [] };
        cat.items.push(newItem);
        save();
        render();
        focusItemText(newItem.id);
        return;
      }
      render();
    });

    wrap.appendChild(header);

    var dropdown = document.createElement("div");
    dropdown.className = "dropdown" + (openCategoryIds[cat.id] ? " open" : "");

    if (getCurrentList().mode === "workout") {
      dropdown.appendChild(renderWorkoutTable(cat));
    } else {
      cat.items.forEach(function(item) {
        dropdown.appendChild(renderItem(cat.items, item));
      });
    }

    wrap.appendChild(dropdown);

    if (isEditing) {
      setTimeout(function() { name.focus(); name.select(); }, 0);
    }

    return wrap;
  }

  function focusItemText(itemId, atEnd) {
    setTimeout(function() {
      var el = categoriesEl.querySelector('[data-item-id="' + itemId + '"]');
      if (el) {
        el.focus();
        var pos = atEnd ? el.value.length : 0;
        try { el.setSelectionRange(pos, pos); } catch (err) {}
      }
    }, 0);
  }

  function renderItem(list, item) {
    item.subtasks = item.subtasks || [];

    var wrap = document.createElement("div");

    var row = document.createElement("div");
    row.className = "item-row";

    var box = document.createElement("div");
    box.className = "checkbox" + (item.done ? " checked" : "");
    box.addEventListener("click", function() {
      toggleItem(list, item);
    });

    var text = createItemTextInput(item, list);

    var actions = document.createElement("div");
    actions.className = "item-actions";

    var addSub = document.createElement("div");
    addSub.className = "item-addsub";
    addSub.textContent = "+";
    addSub.addEventListener("click", function(e) {
      e.stopPropagation();
      var newSub = { id: uid(), text: "", done: false };
      item.subtasks.push(newSub);
      save();
      render();
      focusItemText(newSub.id);
    });

    var del = document.createElement("div");
    del.className = "item-del";
    del.textContent = "×";
    del.addEventListener("click", function(e) {
      e.stopPropagation();
      removeFromList(list, item);
    });

    actions.appendChild(addSub);
    actions.appendChild(del);

    row.appendChild(box);
    row.appendChild(text);
    row.appendChild(actions);
    wrap.appendChild(row);

    if (item.subtasks.length) {
      var subWrap = document.createElement("div");
      subWrap.className = "subtasks";

      item.subtasks.forEach(function(sub) {
        subWrap.appendChild(renderSubtask(item.subtasks, sub));
      });

      wrap.appendChild(subWrap);
    }

    return wrap;
  }

  function renderSubtask(list, item) {
    var row = document.createElement("div");
    row.className = "item-row sub-item-row";

    var box = document.createElement("div");
    box.className = "checkbox" + (item.done ? " checked" : "");
    box.addEventListener("click", function() {
      toggleItem(list, item);
    });

    var text = createItemTextInput(item, list);

    var del = document.createElement("div");
    del.className = "item-del";
    del.textContent = "×";
    del.addEventListener("click", function(e) {
      e.stopPropagation();
      removeFromList(list, item);
    });

    row.appendChild(box);
    row.appendChild(text);
    row.appendChild(del);
    return row;
  }

  function renderWorkoutTable(cat) {
    var workoutList = getCurrentList();
    workoutList.weeks = workoutList.weeks || [{ id: uid(), label: "Week 1" }];

    var wrapDiv = document.createElement("div");
    wrapDiv.className = "workout-table-wrap";

    var table = document.createElement("table");
    table.className = "workout-table";

    var thead = document.createElement("thead");
    var headRow1 = document.createElement("tr");
    var headRow2 = document.createElement("tr");

    var thExercise = document.createElement("th");
    thExercise.className = "wt-exercise";
    thExercise.textContent = "Exercise";
    headRow1.appendChild(thExercise);
    headRow2.appendChild(document.createElement("th"));

    var thSets = document.createElement("th");
    thSets.className = "wt-sets";
    thSets.textContent = "Sets";
    headRow1.appendChild(thSets);
    headRow2.appendChild(document.createElement("th"));

    workoutList.weeks.forEach(function(week) {
      var th = document.createElement("th");
      th.className = "wt-week-header";
      th.colSpan = 2;

      if (editingWeekId === week.id) {
        var wInput = document.createElement("input");
        wInput.className = "wt-week-edit-input";
        wInput.type = "text";
        wInput.value = week.label;
        wInput.maxLength = 20;
        wInput.setAttribute("enterkeyhint", "done");

        var commitWeek = function() {
          var val = wInput.value.trim();
          if (val) week.label = val;
          editingWeekId = null;
          save();
          render();
        };
        wInput.addEventListener("keydown", function(e) {
          e.stopPropagation();
          if (e.isComposing) return;
          if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); commitWeek(); }
          if (e.key === "Escape") { editingWeekId = null; render(); }
        });
        wInput.addEventListener("click", function(e) { e.stopPropagation(); });
        wInput.addEventListener("blur", commitWeek);
        th.appendChild(wInput);

        var wDel = document.createElement("span");
        wDel.className = "wt-week-del";
        wDel.textContent = "×";
        wDel.addEventListener("click", function(e) {
          e.stopPropagation();
          if (confirm('Delete "' + week.label + '" and its data for every exercise?')) {
            workoutList.weeks = workoutList.weeks.filter(function(w) { return w.id !== week.id; });
            editingWeekId = null;
            save();
            render();
          }
        });
        th.appendChild(wDel);
        setTimeout(function() { wInput.focus(); wInput.select(); }, 0);
      } else {
        var label = document.createElement("span");
        label.textContent = week.label;
        label.addEventListener("click", function() {
          editingWeekId = week.id;
          render();
        });
        th.appendChild(label);
      }

      headRow1.appendChild(th);

      var repsTh = document.createElement("th");
      repsTh.className = "wt-subhead";
      repsTh.textContent = "Reps";
      var weightTh = document.createElement("th");
      weightTh.className = "wt-subhead";
      weightTh.textContent = "Weight";
      headRow2.appendChild(repsTh);
      headRow2.appendChild(weightTh);
    });

    var addWeekTh = document.createElement("th");
    addWeekTh.className = "wt-addweek";
    addWeekTh.textContent = "+";
    addWeekTh.addEventListener("click", function() {
      workoutList.weeks.push({ id: uid(), label: "Week " + (workoutList.weeks.length + 1) });
      save();
      render();
    });
    headRow1.appendChild(addWeekTh);
    headRow2.appendChild(document.createElement("th"));

    thead.appendChild(headRow1);
    thead.appendChild(headRow2);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    cat.items.forEach(function(item) {
      tbody.appendChild(renderWorkoutRow(cat.items, item, workoutList));
    });
    table.appendChild(tbody);

    wrapDiv.appendChild(table);
    return wrapDiv;
  }

  function renderWorkoutRow(list, item, workoutList) {
    item.sets = item.sets || "";
    item.cells = item.cells || {};

    var tr = document.createElement("tr");

    var nameTd = document.createElement("td");
    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "wt-input wt-exercise-input";
    nameInput.value = item.text;
    nameInput.maxLength = 60;
    nameInput.setAttribute("data-item-id", item.id);
    nameInput.setAttribute("enterkeyhint", "done");
    nameInput.addEventListener("input", function() {
      item.text = nameInput.value;
      save();
    });
    nameInput.addEventListener("keydown", function(e) {
      e.stopPropagation();
      if (e.isComposing) return;
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        var idx = list.indexOf(item);
        var newItem = { id: uid(), text: "", done: false, subtasks: [], sets: "", cells: {} };
        list.splice(idx + 1, 0, newItem);
        save();
        render();
        focusItemText(newItem.id);
        return;
      }
      if ((e.key === "Backspace" || e.keyCode === 8) && nameInput.value === "") {
        var delIdx = list.indexOf(item);
        if (delIdx > 0) {
          e.preventDefault();
          var prevItem = list[delIdx - 1];
          list.splice(delIdx, 1);
          save();
          render();
          focusItemText(prevItem.id, true);
        }
      }
    });
    nameInput.addEventListener("blur", function() {
      if (nameInput.value.trim() === "") {
        removeFromList(list, item);
      }
    });
    nameTd.appendChild(nameInput);
    tr.appendChild(nameTd);

    var setsTd = document.createElement("td");
    var setsInput = document.createElement("input");
    setsInput.type = "text";
    setsInput.className = "wt-input wt-sets-input";
    setsInput.value = item.sets;
    setsInput.maxLength = 10;
    setsInput.addEventListener("input", function() {
      item.sets = setsInput.value;
      save();
    });
    setsTd.appendChild(setsInput);
    tr.appendChild(setsTd);

    workoutList.weeks.forEach(function(week) {
      item.cells[week.id] = item.cells[week.id] || { reps: "", weight: "" };
      var cell = item.cells[week.id];

      var repsTd = document.createElement("td");
      var repsInput = document.createElement("input");
      repsInput.type = "text";
      repsInput.className = "wt-input wt-cell-input";
      repsInput.value = cell.reps;
      repsInput.maxLength = 10;
      repsInput.addEventListener("input", function() {
        cell.reps = repsInput.value;
        save();
      });
      repsTd.appendChild(repsInput);
      tr.appendChild(repsTd);

      var weightTd = document.createElement("td");
      var weightInput = document.createElement("input");
      weightInput.type = "text";
      weightInput.className = "wt-input wt-cell-input";
      weightInput.value = cell.weight;
      weightInput.maxLength = 10;
      weightInput.addEventListener("input", function() {
        cell.weight = weightInput.value;
        save();
      });
      weightTd.appendChild(weightInput);
      tr.appendChild(weightTd);
    });

    var delTd = document.createElement("td");
    var del = document.createElement("span");
    del.className = "wt-row-del";
    del.textContent = "×";
    del.addEventListener("click", function() {
      removeFromList(list, item);
    });
    delTd.appendChild(del);
    tr.appendChild(delTd);

    return tr;
  }

  function removeFromList(list, item) {
    var idx = list.indexOf(item);
    if (idx === -1) return;
    list.splice(idx, 1);
    save();
    render();
  }

  function createItemTextInput(item, list) {
    var text = document.createElement("input");
    text.type = "text";
    text.className = "item-text" + (item.done ? " done" : "");
    text.value = item.text;
    text.maxLength = 200;
    text.setAttribute("enterkeyhint", "done");
    text.setAttribute("data-item-id", item.id);
    text.addEventListener("input", function() {
      item.text = text.value;
      save();
    });
    text.addEventListener("keydown", function(e) {
      e.stopPropagation();
      if (e.isComposing) return;
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        var pos = text.selectionStart == null ? text.value.length : text.selectionStart;
        var idx = list.indexOf(item);
        if (pos === 0 && text.value.length > 0) {
          var blankItem = { id: uid(), text: "", done: false, subtasks: [] };
          list.splice(idx, 0, blankItem);
          save();
          render();
          focusItemText(item.id);
          return;
        }
        var before = text.value.slice(0, pos);
        var after = text.value.slice(pos);
        item.text = before;
        var newItem = { id: uid(), text: after, done: false, subtasks: [] };
        list.splice(idx + 1, 0, newItem);
        save();
        render();
        focusItemText(newItem.id);
        return;
      }
      if ((e.key === "Backspace" || e.keyCode === 8) && text.value === "") {
        var delIdx = list.indexOf(item);
        if (delIdx > 0) {
          e.preventDefault();
          var prevItem = list[delIdx - 1];
          list.splice(delIdx, 1);
          save();
          render();
          focusItemText(prevItem.id, true);
        }
      }
    });
    text.addEventListener("blur", function() {
      var isEmpty = text.value.trim() === "";
      var hasSubtasks = item.subtasks && item.subtasks.length > 0;
      if (isEmpty && !hasSubtasks) {
        removeFromList(list, item);
      }
    });
    return text;
  }

  function toggleItem(list, item) {
    var idx = list.indexOf(item);
    if (idx === -1) return;
    list.splice(idx, 1);
    item.done = !item.done;
    var firstDoneIdx = list.findIndex(function(i) { return i.done; });
    if (firstDoneIdx === -1) {
      list.push(item);
    } else {
      list.splice(firstDoneIdx, 0, item);
    }
    save();
    render();
  }

  newCatInput.addEventListener("keydown", function(e) {
    if (e.isComposing) return;
    if (e.key === "Enter" || e.keyCode === 13) {
      e.preventDefault();
      var val = newCatInput.value.trim();
      if (val) {
        var cat = { id: uid(), name: val, items: [] };
        var newItem = { id: uid(), text: "", done: false, subtasks: [] };
        cat.items.push(newItem);
        getCurrentList().categories.push(cat);
        newCatInput.value = "";
        save();
        openCategoryIds[cat.id] = true;
        render();
        focusItemText(newItem.id);
      }
    }
  });

  var backupLink = document.getElementById("backupLink");
  var restoreLink = document.getElementById("restoreLink");
  var backupStatus = document.getElementById("backupStatus");
  var restorePanel = document.getElementById("restorePanel");
  var restoreInput = document.getElementById("restoreInput");
  var restoreLoad = document.getElementById("restoreLoad");
  var restoreCancel = document.getElementById("restoreCancel");
  var BACKUP_META_KEY = "todo-backup-meta";

  function exportText() {
    return state.lists.map(function(list) {
      var isWorkout = list.mode === "workout";
      var chunks = ["## " + list.name + (isWorkout ? " [workout]" : "")];

      if (isWorkout) {
        var weeks = list.weeks || [];
        chunks.push("Weeks: " + weeks.map(function(w) { return w.label; }).join(", "));
      }

      var body = list.categories.map(function(cat) {
        var lines = [cat.name];
        cat.items.forEach(function(item) {
          if (isWorkout) {
            var parts = [item.text, "Sets: " + (item.sets || "")];
            (list.weeks || []).forEach(function(week) {
              var cell = (item.cells && item.cells[week.id]) || { reps: "", weight: "" };
              parts.push(week.label + " reps: " + cell.reps);
              parts.push(week.label + " weight: " + cell.weight);
            });
            lines.push(parts.join(" | "));
          } else {
            lines.push("[" + (item.done ? "x" : " ") + "] " + item.text);
            (item.subtasks || []).forEach(function(sub) {
              lines.push("  [" + (sub.done ? "x" : " ") + "] " + sub.text);
            });
          }
        });
        return lines.join("\n");
      }).join("\n\n");

      if (body) chunks.push(body);
      return chunks.join("\n\n");
    }).join("\n\n");
  }

  function parseCategoriesFromText(text) {
    var blocks = text.split(/\n\s*\n/);
    var result = [];
    blocks.forEach(function(block) {
      var lines = block.split("\n").filter(function(l) { return l.trim() !== ""; });
      if (!lines.length) return;
      var nameLine = lines[0];
      if (/^\s*\[[ xX]\]/.test(nameLine)) return;
      var cat = { id: uid(), name: nameLine.trim(), items: [] };
      var currentItem = null;
      for (var i = 1; i < lines.length; i++) {
        var m = lines[i].match(/^(\s*)\[([ xX])\]\s?(.*)$/);
        if (!m) continue;
        var indent = m[1].length;
        var done = m[2].toLowerCase() === "x";
        var text = m[3];
        if (indent >= 2 && currentItem) {
          currentItem.subtasks.push({ id: uid(), text: text, done: done });
        } else {
          currentItem = { id: uid(), text: text, done: done, subtasks: [] };
          cat.items.push(currentItem);
        }
      }
      result.push(cat);
    });
    return result;
  }

  function parseWorkoutCategoriesFromText(text, weekLabelToId) {
    var blocks = text.split(/\n\s*\n/);
    var result = [];
    blocks.forEach(function(block) {
      var lines = block.split("\n").filter(function(l) { return l.trim() !== ""; });
      if (!lines.length) return;
      var cat = { id: uid(), name: lines[0].trim(), items: [] };
      for (var i = 1; i < lines.length; i++) {
        var segments = lines[i].split(/\s*\|\s*/).map(function(s) { return s.trim(); }).filter(function(s) { return s !== ""; });
        if (!segments.length) continue;
        var item = { id: uid(), text: segments[0], done: false, subtasks: [], sets: "", cells: {} };
        for (var j = 1; j < segments.length; j++) {
          var seg = segments[j];
          var setsMatch = seg.match(/^Sets:\s*(.*)$/i);
          if (setsMatch) { item.sets = setsMatch[1]; continue; }
          var cellMatch = seg.match(/^(.*)\s+(reps|weight):\s*(.*)$/i);
          if (cellMatch) {
            var weekLabel = cellMatch[1].trim();
            var field = cellMatch[2].toLowerCase();
            var value = cellMatch[3];
            var weekId = weekLabelToId[weekLabel];
            if (!weekId) {
              weekId = uid();
              weekLabelToId[weekLabel] = weekId;
            }
            item.cells[weekId] = item.cells[weekId] || { reps: "", weight: "" };
            item.cells[weekId][field] = value;
          }
        }
        cat.items.push(item);
      }
      result.push(cat);
    });
    return result;
  }

  function parseBackupText(raw) {
    var normalized = raw.replace(/\r\n/g, "\n");
    var lines = normalized.split("\n");
    var headerRe = /^##\s+(.*)$/;
    var hasHeaders = lines.some(function(l) { return headerRe.test(l.trim()); });

    if (!hasHeaders) {
      return [{ id: uid(), name: "Restored List", categories: parseCategoriesFromText(normalized) }];
    }

    var lists = [];
    var currentName = null;
    var currentMode;
    var currentLines = [];

    function flush() {
      if (currentName === null) return;

      if (currentMode === "workout") {
        var bodyLines = currentLines.slice();
        var firstNonEmptyIdx = -1;
        for (var k = 0; k < bodyLines.length; k++) {
          if (bodyLines[k].trim() !== "") { firstNonEmptyIdx = k; break; }
        }
        var weekLabelToId = {};
        var weeksList = [];
        if (firstNonEmptyIdx !== -1) {
          var weeksMatch = bodyLines[firstNonEmptyIdx].trim().match(/^Weeks:\s*(.*)$/i);
          if (weeksMatch) {
            weeksMatch[1].split(",").map(function(s) { return s.trim(); }).filter(Boolean).forEach(function(label) {
              var id = uid();
              weekLabelToId[label] = id;
              weeksList.push({ id: id, label: label });
            });
            bodyLines.splice(firstNonEmptyIdx, 1);
          }
        }
        var categories = parseWorkoutCategoriesFromText(bodyLines.join("\n"), weekLabelToId);
        lists.push({ id: uid(), name: currentName, mode: "workout", weeks: weeksList, categories: categories });
      } else {
        lists.push({ id: uid(), name: currentName, categories: parseCategoriesFromText(currentLines.join("\n")) });
      }
    }

    lines.forEach(function(line) {
      var m = line.trim().match(headerRe);
      if (m) {
        flush();
        var raw2 = m[1].trim();
        var modeMatch = raw2.match(/^(.*?)\s*\[workout\]$/);
        if (modeMatch) {
          currentName = modeMatch[1].trim() || "List";
          currentMode = "workout";
        } else {
          currentName = raw2 || "List";
          currentMode = undefined;
        }
        currentLines = [];
      } else if (currentName !== null) {
        currentLines.push(line);
      }
    });
    flush();

    return lists;
  }

  function loadBackupMeta() {
    try {
      return JSON.parse(window.localStorage.getItem(BACKUP_META_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveBackupMeta(meta) {
    try {
      window.localStorage.setItem(BACKUP_META_KEY, JSON.stringify(meta));
    } catch (e) {}
  }

  function formatAgo(ts) {
    if (!ts) return "never";
    var days = Math.floor((Date.now() - ts) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "1 day ago";
    return days + " days ago";
  }

  function updateBackupStatus() {
    backupStatus.textContent = "last backup: " + formatAgo(loadBackupMeta().lastAt);
  }

  backupLink.addEventListener("click", function() {
    var text = exportText();
    if (!text) {
      alert("Nothing to back up yet.");
      return;
    }
    var meta = loadBackupMeta();
    if (!meta.email) {
      meta.email = window.prompt("Email address to send backups to? (saved on this device only)") || "";
    }
    meta.lastAt = Date.now();
    saveBackupMeta(meta);
    updateBackupStatus();
    var subject = encodeURIComponent("To-Do backup " + new Date().toLocaleDateString());
    var body = encodeURIComponent(text);
    window.location.href = "mailto:" + meta.email + "?subject=" + subject + "&body=" + body;
  });

  restoreLink.addEventListener("click", function() {
    var showing = restorePanel.style.display !== "none";
    restorePanel.style.display = showing ? "none" : "block";
    if (!showing) restoreInput.focus();
  });

  restoreCancel.addEventListener("click", function() {
    restoreInput.value = "";
    restorePanel.style.display = "none";
  });

  restoreLoad.addEventListener("click", function() {
    var raw = restoreInput.value;
    if (!raw.trim()) return;
    if (!confirm("This will replace all your lists. Continue?")) return;
    var lists = parseBackupText(raw);
    if (!lists.length) {
      alert("Couldn't find anything to restore in that text.");
      return;
    }
    state.lists = lists;
    state.currentListId = lists[0].id;
    openCategoryIds = {};
    editingCategoryId = null;
    editingListId = null;
    save();
    restoreInput.value = "";
    restorePanel.style.display = "none";
    renderTabs();
    render();
  });

  updateBackupStatus();

  ensureWorkoutTab();
  ensureWorkoutPlanV1();
  renderTabs();
  render();

  if ("serviceWorker" in navigator) {
    var reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", function() {
      if (reloadedForUpdate) return;
      reloadedForUpdate = true;
      window.location.reload();
    });
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("service-worker.js").then(function(reg) {
        reg.update();
      }).catch(function() {});
    });
  }
})();
</script>
