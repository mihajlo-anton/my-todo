<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>To-Do</title>
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    color: #e8e8e8;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    text-align: left;
  }
  #app {
    max-width: 640px;
    margin: 0;
    padding: 20px 12px 60px;
    min-height: 100vh;
  }

  /* category row */
  .category {
    position: relative;
    margin-bottom: 2px;
  }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 2px;
    cursor: pointer;
    user-select: none;
  }
  .cat-name {
    font-size: 17px;
    font-weight: 500;
    color: #f2f2f2;
    letter-spacing: 0.2px;
    text-align: left;
  }
  .cat-meta {
    font-size: 12px;
    color: #555;
  }
  .cat-header:hover .cat-name { color: #fff; }
  .cat-del, .cat-edit {
    opacity: 0;
    color: #444;
    font-size: 13px;
    padding: 4px 8px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .cat-header:hover .cat-del,
  .cat-header:hover .cat-edit { opacity: 1; }
  .cat-del:hover, .cat-edit:hover { color: #999; }

  /* dropdown (pushes content below it down, since it's in normal flow) */
  .dropdown {
    background: #0d0d0d;
    border-radius: 8px;
    padding: 0 8px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.18s ease, padding 0.18s ease;
  }
  .dropdown.open {
    padding: 4px 8px 6px;
    max-height: 2000px;
  }

  .cat-edit-input {
    font-size: 17px;
    font-weight: 500;
    color: #f2f2f2;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    letter-spacing: 0.2px;
    width: 100%;
    text-align: left;
  }

  .item-row {
    display: flex;
    align-items: center;
    padding: 5px 2px;
    gap: 10px;
  }
  .checkbox {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    border: 1.5px solid #666;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
  }
  .checkbox:hover { border-color: #999; }
  .checkbox.checked {
    background: #4a4a4a;
    border-color: #4a4a4a;
  }
  .checkbox.checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #eee;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .item-text {
    flex: 1 1 auto;
    font-size: 15px;
    color: #ddd;
    cursor: default;
    word-break: break-word;
    text-align: left;
  }
  .item-text.done {
    color: #4a4a4a;
    text-decoration: line-through;
  }
  .item-del {
    flex: 0 0 auto;
    opacity: 0;
    color: #444;
    font-size: 13px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .item-row:hover .item-del { opacity: 1; }
  .item-del:hover { color: #999; }

  .add-item-row {
    display: flex;
    align-items: center;
    padding: 5px 2px 2px;
    gap: 10px;
  }
  .add-item-row .checkbox-placeholder { width: 17px; flex: 0 0 auto; }
  .add-item-row input {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: #ddd;
    font-size: 15px;
    font-family: inherit;
    text-align: left;
  }
  .add-item-row input::placeholder { color: #444; }

  /* add category */
  .add-cat {
    margin-top: 14px;
    padding: 8px 2px;
  }
  .add-cat input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #666;
    font-size: 17px;
    font-family: inherit;
    font-weight: 500;
    text-align: left;
  }
  .add-cat input::placeholder { color: #333; }
</style>
</head>
<body>
<div id="app">
  <div id="categories"></div>
  <div class="add-cat">
    <input id="newCatInput" type="text" placeholder="+ add category" maxlength="60">
  </div>
</div>

<script>
(function() {
  "use strict";

  var STORAGE_KEY = "todo-data-v1";
  var state = load();

  function load() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { categories: [] };
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var openCategoryIds = {};
  var editingCategoryId = null;

  var categoriesEl = document.getElementById("categories");
  var newCatInput = document.getElementById("newCatInput");

  function render() {
    categoriesEl.innerHTML = "";
    state.categories.forEach(function(cat) {
      categoriesEl.appendChild(renderCategory(cat));
    });
  }

  function renderCategory(cat) {
    var wrap = document.createElement("div");
    wrap.className = "category";

    var header = document.createElement("div");
    header.className = "cat-header";

    var isEditing = editingCategoryId === cat.id;
    var name;

    if (isEditing) {
      name = document.createElement("input");
      name.className = "cat-edit-input";
      name.type = "text";
      name.maxLength = 60;
      name.value = cat.name;

      var commit = function() {
        var val = name.value.trim();
        if (val) cat.name = val;
        editingCategoryId = null;
        save();
        render();
      };
      name.addEventListener("keydown", function(e) {
        e.stopPropagation();
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { editingCategoryId = null; render(); }
      });
      name.addEventListener("click", function(e) { e.stopPropagation(); });
      name.addEventListener("blur", commit);
    } else {
      name = document.createElement("div");
      name.className = "cat-name";
      name.textContent = cat.name;
    }

    var right = document.createElement("div");
    right.style.display = "flex";
    right.style.alignItems = "center";
    right.style.gap = "10px";

    var remaining = cat.items.filter(function(i) { return !i.done; }).length;
    var meta = document.createElement("div");
    meta.className = "cat-meta";
    meta.textContent = cat.items.length ? remaining : "";

    var edit = document.createElement("div");
    edit.className = "cat-edit";
    edit.textContent = "edit";
    edit.addEventListener("click", function(e) {
      e.stopPropagation();
      editingCategoryId = cat.id;
      render();
    });

    var del = document.createElement("div");
    del.className = "cat-del";
    del.textContent = "remove";
    del.addEventListener("click", function(e) {
      e.stopPropagation();
      if (confirm('Delete category "' + cat.name + '" and all its items?')) {
        state.categories = state.categories.filter(function(c) { return c.id !== cat.id; });
        delete openCategoryIds[cat.id];
        save();
        render();
      }
    });

    if (!isEditing) {
      right.appendChild(meta);
      right.appendChild(edit);
      right.appendChild(del);
    }
    header.appendChild(name);
    header.appendChild(right);

    header.addEventListener("click", function() {
      if (editingCategoryId === cat.id) return;
      openCategoryIds[cat.id] = !openCategoryIds[cat.id];
      render();
    });

    wrap.appendChild(header);

    var dropdown = document.createElement("div");
    dropdown.className = "dropdown" + (openCategoryIds[cat.id] ? " open" : "");

    cat.items.forEach(function(item) {
      dropdown.appendChild(renderItem(cat, item));
    });

    var addRow = document.createElement("div");
    addRow.className = "add-item-row";
    var placeholder = document.createElement("div");
    placeholder.className = "checkbox-placeholder";
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "+ add item";
    input.maxLength = 200;
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        var val = input.value.trim();
        if (val) {
          cat.items.push({ id: uid(), text: val, done: false });
          save();
          render();
          focusAddInput(cat.id);
        }
      }
    });
    addRow.appendChild(placeholder);
    addRow.appendChild(input);
    dropdown.appendChild(addRow);

    wrap.appendChild(dropdown);

    if (openCategoryIds[cat.id]) {
      setTimeout(function() { input.focus(); }, 0);
    }

    if (isEditing) {
      setTimeout(function() { name.focus(); name.select(); }, 0);
    }

    return wrap;
  }

  function focusAddInput(catId) {
    setTimeout(function() {
      var cats = categoriesEl.querySelectorAll(".category");
      state.categories.forEach(function(c, idx) {
        if (c.id === catId) {
          var inp = cats[idx].querySelector(".add-item-row input");
          if (inp) inp.focus();
        }
      });
    }, 0);
  }

  function renderItem(cat, item) {
    var row = document.createElement("div");
    row.className = "item-row";

    var box = document.createElement("div");
    box.className = "checkbox" + (item.done ? " checked" : "");
    box.addEventListener("click", function() {
      toggleItem(cat, item);
    });

    var text = document.createElement("div");
    text.className = "item-text" + (item.done ? " done" : "");
    text.textContent = item.text;
    text.addEventListener("click", function() {
      toggleItem(cat, item);
    });

    var del = document.createElement("div");
    del.className = "item-del";
    del.textContent = "×";
    del.addEventListener("click", function(e) {
      e.stopPropagation();
      cat.items = cat.items.filter(function(i) { return i.id !== item.id; });
      save();
      render();
    });

    row.appendChild(box);
    row.appendChild(text);
    row.appendChild(del);
    return row;
  }

  function toggleItem(cat, item) {
    var idx = cat.items.indexOf(item);
    cat.items.splice(idx, 1);

    if (!item.done) {
      item.done = true;
      var firstDoneIdx = cat.items.findIndex(function(i) { return i.done; });
      if (firstDoneIdx === -1) {
        cat.items.push(item);
      } else {
        cat.items.splice(firstDoneIdx, 0, item);
      }
    } else {
      item.done = false;
      var firstDoneIdx = cat.items.findIndex(function(i) { return i.done; });
      if (firstDoneIdx === -1) {
        cat.items.push(item);
      } else {
        cat.items.splice(firstDoneIdx, 0, item);
      }
    }
    save();
    render();
  }

  newCatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      var val = newCatInput.value.trim();
      if (val) {
        var cat = { id: uid(), name: val, items: [] };
        state.categories.push(cat);
        newCatInput.value = "";
        save();
        openCategoryIds[cat.id] = true;
        render();
      }
    }
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("service-worker.js").catch(function() {});
    });
  }
})();
</script>
</body>
</html>
